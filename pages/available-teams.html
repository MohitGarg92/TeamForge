<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Teams - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar" id="mainNav">
        <div class="nav-brand">TeamForge</div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="available-teams.html" class="active">Browse Teams</a>
            <a href="my-teams.html">My Teams</a>
            <a href="my-requests.html">My Requests</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn" class="btn-nav-outline">Logout</a>
        </div>
    </nav>
    <div class="container section">
        <button type="button" onclick="window.history.length > 1 ? window.history.back() : window.location.href='dashboard.html'" class="btn-back">
            <span class="arrow">←</span> Go Back
        </button>
        <div class="page-header">
            <h2>🔍 Available Teams</h2>
            <p>Browse open teams and find one that matches your skills.</p>
        </div>
        <div class="filters card mt-1">
            <input type="text" id="searchTeam" placeholder="Search by name, skill, or description...">
            <select id="filterHackathon">
                <option value="all">All Hackathons</option>
                <option value="Hack4Good">Hack4Good</option>
                <option value="AI Innovation Challenge">AI Innovation Challenge</option>
            </select>
            <button class="btn-outline" onclick="filterTeams()">Apply Filters</button>
        </div>
        <div id="teamsList" class="grid-3 mt-2"></div>
    </div>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/teams.js"></script>
</body>
</html>
