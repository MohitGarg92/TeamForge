<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar" id="mainNav">
        <div class="nav-brand">TeamForge</div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="available-teams.html">Browse Teams</a>
            <a href="my-teams.html">My Teams</a>
            <a href="my-requests.html">My Requests</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn" class="btn-nav-outline">Logout</a>
        </div>
    </nav>
    <div class="container section">
        <button type="button"
            onclick="window.history.length > 1 ? window.history.back() : window.location.href='dashboard.html'"
            class="btn-back">
            <span class="arrow">←</span> Go Back
        </button>
        <div class="page-header">
            <h2>🚀 Create a New Team</h2>
            <p>Set up your team and start recruiting members.</p>
        </div>
        <div class="card mt-1">
            <form id="createTeamForm">
                <fieldset disabled>
                    <div class="form-group"><label for="tName">Team Name</label>
                        <input type="text" id="tName" required maxlength="255" placeholder="e.g. Smart Campus"></div>
                    <div class="form-group"><label for="tTitle">Project Title</label>
                        <input type="text" id="tTitle" required maxlength="255" placeholder="e.g. Campus IoT Platform"></div>
                    <div class="form-group"><label for="tDesc">Project Description</label>
                        <textarea id="tDesc" required maxlength="10000" placeholder="Describe what your team will build..."></textarea></div>
                    <div class="form-group"><label for="tHack">Hackathon (optional)</label>
                        <select id="tHack"><option value="">No hackathon</option></select></div>
                    <div class="form-group"><label for="tCap">Total Team Size (including you)</label>
                        <input type="number" id="tCap" required min="2" max="10" placeholder="2–10 members"></div>
                    <div class="form-group"><label for="tSkills">Required Skills (comma separated)</label>
                        <input type="text" id="tSkills" required placeholder="JavaScript, Python, SQL"></div>
                    <button type="submit" class="btn-primary mt-1">Create Team →</button>
                </fieldset>
                <p class="mt-1" id="teamFeedback" role="status">Loading hackathons…</p>
            </form>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/teams.js"></script>
</body>

</html>
