<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Team - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar" id="mainNav">
        <div class="nav-brand">TeamForge</div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="available-teams.html">Browse Teams</a>
            <a href="my-teams.html">My Teams</a>
            <a href="my-requests.html">My Requests</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn" class="btn-nav-outline">Logout</a>
        </div>
    </nav>
    <div class="container section">
        <button type="button" onclick="window.history.length > 1 ? window.history.back() : window.location.href='dashboard.html'" class="btn-back">
            <span class="arrow">←</span> Go Back
        </button>
        <div class="page-header">
            <h2>🚀 Create a New Team</h2>
            <p>Set up your team and start recruiting members.</p>
        </div>
        <div class="card mt-1">
            <form id="createTeamForm">
                <div class="form-group"><label>Team Name</label><input type="text" id="tName" required placeholder="e.g. Smart Campus"></div>
                <div class="form-group"><label>Project Description</label><textarea id="tDesc" required placeholder="Describe what your team will build..."></textarea></div>
                <div class="form-group"><label>Hackathon</label><input type="text" id="tHack" required placeholder="e.g. Hack4Good"></div>
                <div class="form-group"><label>Required Capacity</label><input type="number" id="tCap" required min="2" max="10" placeholder="2–10 members"></div>
                <div class="form-group"><label>Required Skills (comma separated)</label><input type="text" id="tSkills" required placeholder="JavaScript, Python, SQL"></div>
                <button type="submit" class="btn-primary mt-1">Create Team →</button>
            </form>
        </div>
    </div>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        api.requireAuth();

        document.getElementById('createTeamForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('tName').value.trim();
            const desc = document.getElementById('tDesc').value.trim();
            const hackathon = document.getElementById('tHack').value.trim();
            const capacity = parseInt(document.getElementById('tCap').value);
            const skillsRaw = document.getElementById('tSkills').value.trim();
            const skills = skillsRaw.split(',').map(s => s.trim()).filter(Boolean);

            if (!name || !desc || !hackathon || !capacity || skills.length === 0) {
                alert('Please fill in all fields.');
                return;
            }

            const data = api.getData();
            const newTeam = {
                id: data.nextTeamId || (data.teams.length + 1),
                name: name,
                description: desc,
                hackathon: hackathon,
                leaderId: api.getCurrentUser(),
                capacity: capacity,
                currentMembers: 1,
                status: "open",
                skills: skills,
                members: [api.getCurrentUser()]
            };

            data.teams.push(newTeam);
            data.nextTeamId = (data.nextTeamId || data.teams.length) + 1;
            api.saveData(data);

            alert("Team created successfully!");
            window.location.href = 'my-teams.html';
        });
    </script>
</body>
</html>
