<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <nav class="navbar" id="mainNav">
        <div class="nav-brand">TeamForge</div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks">
            <a href="dashboard.html">Dashboard</a>
            <a href="available-teams.html">Browse Teams</a>
            <a href="my-teams.html">My Teams</a>
            <a href="my-requests.html">My Requests</a>
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn" class="btn-nav-outline">Logout</a>
        </div>
    </nav>
    <div class="container section">
        <button type="button"
            onclick="window.history.length > 1 ? window.history.back() : window.location.href='profile.html'"
            class="btn-back">
            <span class="arrow">←</span> Go Back
        </button>
        <div class="page-header">
            <h2>✏️ Edit Profile</h2>
            <p>Name, student ID, phone number, and at least one skill are required before creating or joining a team.</p>
        </div>
        <div class="card mt-1">
            <form id="editProfileForm">
                <fieldset disabled>
                    <div class="form-group"><label for="pEmail">Thapar Email</label>
                        <input type="email" id="pEmail" readonly></div>
                    <div class="form-group"><label for="pName">Full Name</label>
                        <input type="text" id="pName" required maxlength="255" autocomplete="name"></div>
                    <div class="form-group"><label for="pStudentId">Student ID</label>
                        <input type="text" id="pStudentId" required maxlength="50"></div>
                    <div class="form-group"><label for="pPhone">Phone</label>
                        <input type="tel" id="pPhone" required maxlength="20" autocomplete="tel"></div>
                    <div class="form-group"><label for="pGit">GitHub (optional)</label>
                        <input type="text" id="pGit" maxlength="255" placeholder="github.com/username"></div>
                    <div class="form-group"><label for="pLink">LinkedIn (optional)</label>
                        <input type="text" id="pLink" maxlength="255" placeholder="linkedin.com/in/username"></div>
                    <div class="form-group"><label for="pResume">Resume Link (optional)</label>
                        <input type="text" id="pResume" maxlength="255" placeholder="https://example.com/resume"></div>
                    <div class="form-group"><label for="pSkills">Skills (comma separated)</label>
                        <input type="text" id="pSkills" required placeholder="C++, Python, ML"></div>
                    <button type="submit" class="btn-primary mt-1">Save Changes →</button>
                </fieldset>
                <p class="mt-1" id="profileFeedback" role="status">Loading profile…</p>
            </form>
        </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/profile.js"></script>
</body>

</html>
