<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-light">
    <div class="auth-container large">
        <div class="card auth-card">
            <h2 class="text-center">Register</h2>
            <form id="registerForm">
                <h4>Student Information</h4>
                <div class="form-group"><label>Full Name</label><input type="text" id="regName" required></div>
                <div class="form-group"><label>Thapar Student ID</label><input type="text" id="regStudentId" required placeholder="e.g. 102024000"></div>
                <div class="form-group"><label>College Email</label><input type="email" id="regEmail" required></div>
                <div class="form-group"><label>Password</label><input type="password" id="regPassword" required></div>
                
                <h4 class="mt-2">Professional Information</h4>
                <div class="form-group"><label>GitHub Profile</label><input type="text" id="regGithub" placeholder="github.com/username"></div>
                <div class="form-group"><label>Skills (comma separated)</label><input type="text" id="regSkills" placeholder="C++, Java, Python"></div>
                
                <button type="submit" class="btn-primary w-100 mt-2">Create Account</button>
            </form>
            <div class="text-center mt-1"><a href="login.html">Already have an account? Login</a></div>
        </div>
    </div>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
