<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-light">
    <div class="auth-container large">
        <div class="card auth-card">
            <div class="text-center" style="margin-bottom:1.5rem">
                <div class="nav-brand" style="justify-content:center; font-size:1.5rem; margin-bottom:0.5rem">TeamForge</div>
                <p class="text-muted">Create your student account</p>
            </div>
            <form id="registerForm">
                <h4>Student Information</h4>
                <div class="form-group"><label>Full Name</label><input type="text" id="regName" required placeholder="Enter your full name"></div>
                <div class="form-group"><label>Thapar Student ID</label><input type="text" id="regStudentId" required placeholder="e.g. 102024000"></div>
                <div class="form-group"><label>College Email</label><input type="email" id="regEmail" required placeholder="you@thapar.edu"></div>
                <div class="form-group"><label>Password</label><input type="password" id="regPassword" required placeholder="Choose a strong password"></div>
                
                <h4 class="mt-2">Professional Information</h4>
                <div class="form-group"><label>GitHub Profile</label><input type="text" id="regGithub" placeholder="github.com/username"></div>
                <div class="form-group"><label>Skills (comma separated)</label><input type="text" id="regSkills" placeholder="C++, Java, Python, React"></div>
                
                <button type="submit" class="btn-primary w-100 mt-2">Create Account</button>
            </form>
            <div class="text-center mt-1" style="font-size:0.9rem"><a href="login.html">Already have an account? <strong class="text-red">Login</strong></a></div>
        </div>
    </div>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
