<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-light">
    <div class="auth-container large">
        <div class="card auth-card">
            <!-- Go Back Button -->
            <button type="button" onclick="window.history.length > 1 ? window.history.back() : window.location.href='login.html'" class="btn-back">
                <span class="arrow">←</span> Go Back
            </button>

            <div class="text-center" style="margin-bottom:1.5rem">
                <div class="nav-brand" style="justify-content:center; font-size:1.6rem; margin-bottom:0.25rem">
                    Team<span>Forge</span>
                </div>
                <p class="text-muted" style="font-size:0.9rem">Create your student account</p>
            </div>
            <form id="registerForm">
                <h4 style="font-size:0.95rem; margin-bottom:0.75rem; color:var(--gray-700)">Student Information</h4>
                <div class="form-group"><label>Full Name</label><input type="text" id="regName" required placeholder="e.g. Mohit Garg"></div>
                <div class="form-group"><label>Thapar Student ID (Roll No.)</label><input type="text" id="regStudentId" required placeholder="e.g. 1024031006"></div>
                <div class="form-group"><label>College Email</label><input type="email" id="regEmail" required placeholder="you@thapar.edu"></div>
                <div class="form-group"><label>Password</label><input type="password" id="regPassword" placeholder="Choose a password"></div>
                
                <h4 class="mt-2" style="font-size:0.95rem; margin-bottom:0.75rem; color:var(--gray-700)">Professional Information</h4>
                <div class="form-group"><label>GitHub Profile</label><input type="text" id="regGithub" placeholder="github.com/username"></div>
                <div class="form-group"><label>Skills (comma separated)</label><input type="text" id="regSkills" placeholder="React, Node.js, Python, SQL"></div>
                
                <button type="submit" class="btn-primary w-100 mt-2">Create Account →</button>
            </form>
            <div class="text-center mt-1" style="font-size:0.9rem"><a href="login.html">Already have an account? <strong class="text-red">Login</strong></a></div>
        </div>
    </div>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
