<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>My Requests</title><link rel="stylesheet" href="../css/style.css"></head>
<body>
    <nav class="navbar"><div class="nav-brand">Project Team Matcher</div><div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="available-teams.html">Teams</a></div></nav>
    <div class="container section"><h2>My Requests</h2><div id="requestsList" class="mt-2"></div></div>
    <script src="../js/mock-data.js"></script><script src="../js/main.js"></script>
    <script>
        api.requireAuth();
        const data = api.getData();
        const reqs = data.requests.filter(r => r.studentId === api.getCurrentUser());
        const cont = document.getElementById('requestsList');

        if (reqs.length === 0) {
            cont.innerHTML = "<p class='text-muted'>No requests found. Browse available teams to send a join request.</p>";
        } else {
            reqs.forEach(r => {
                const team = data.teams.find(t => t.id === r.teamId);
                const teamName = team ? team.name : `Team #${r.teamId}`;
                const statusClass = r.status === 'Accepted' ? 'text-red' : '';
                cont.innerHTML += `
                    <div class="card mt-1">
                        <h4>${teamName}</h4>
                        ${team ? `<p class="text-muted">${team.hackathon}</p>` : ''}
                        <p>Status: <strong class="${statusClass}">${r.status}</strong></p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
