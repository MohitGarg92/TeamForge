<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="bg-light">
    <div class="auth-container">
        <div class="card auth-card">
            <div class="text-center" style="margin-bottom:1.5rem">
                <div class="nav-brand" style="justify-content:center; font-size:1.5rem; margin-bottom:0.5rem">TeamForge</div>
                <p class="text-muted">Sign in to your account</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Student ID</label>
                    <input type="text" id="studentId" required placeholder="e.g. 102024000">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn-primary w-100">Login</button>
                <div class="text-center mt-1" style="font-size:0.9rem">
                    <a href="#" class="text-red">Forgot Password?</a><br>
                    <a href="register.html" style="margin-top:0.5rem; display:inline-block">Don't have an account? <strong class="text-red">Register</strong></a>
                </div>
            </form>
        </div>
    </div>
    
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
