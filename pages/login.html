<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TeamForge</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body class="bg-light">
    <div class="auth-container">
        <div class="card auth-card">
            <!-- Go Back Button -->
            <button type="button"
                onclick="window.history.length > 1 ? window.history.back() : window.location.href='../index.html'"
                class="btn-back">
                <span class="arrow">←</span> Go Back
            </button>

            <div class="text-center" style="margin-bottom:1.5rem">
                <div class="nav-brand" style="justify-content:center; font-size:1.6rem; margin-bottom:0.25rem">
                    Team<span>Forge</span>
                </div>
                <p class="text-muted" style="font-size:0.9rem">Sign in with your Thapar Google account</p>
            </div>

            <a href="/api/auth/google" id="googleLogin" class="btn-primary w-100"
                style="display:block; text-align:center">Sign in with Google</a>
            <p id="loginError" class="text-red mt-1" role="alert" hidden></p>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        document.getElementById('googleLogin').href = `${API_BASE}/api/auth/google`;
        const loginError = new URLSearchParams(window.location.search).get('error');
        if (loginError) {
            const message = document.getElementById('loginError');
            message.textContent = loginError === 'not_allowed'
                ? 'Sign in with a verified @thapar.edu account.'
                : 'Google sign-in could not be completed. Please try again.';
            message.hidden = false;
        }
    </script>
</body>

</html>
